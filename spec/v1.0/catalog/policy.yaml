# PhiSQL v1.0 policy-naming semantics.
#
# Defines how a PhiSQL document's POLICY declaration relates to the Phileas
# JSON policy filename. The Phileas JSON policy schema has no top-level name
# field; policy identity comes from the filename. This file documents the rule
# that bridges that convention with PhiSQL's POLICY declaration.
#
# Status: Stable (v1.0).

version: v1.0

policy_name:
  source: filename_basename
  description: |
    The policy name is the file basename (with the .phisql or .json
    extension stripped). This matches the existing convention in
    philterd/pii-redaction-policies and how Phileas resolves policies
    by name today.

policy_declaration:
  required: false
  description: |
    The POLICY <name> declaration inside a PhiSQL document is optional.
    A PhiSQL file containing only REDACT / DEIDENTIFY / IGNORE statements
    is well-formed and compiles successfully.

consistency_rule:
  applies_when: filename_known_and_policy_declared
  rule: declared_name_must_match_basename_after_normalization
  normalization:
    description: |
      Hyphens in the filename basename and underscores in the PhiSQL
      identifier are treated as equivalent for comparison purposes.
      Phileas filenames conventionally use hyphens (hipaa-safe-harbor.json);
      PhiSQL identifiers cannot contain hyphens. The normalization
      bridges the two without forcing users to rename files.
    rule: replace_hyphens_with_underscores_in_both_sides
  on_mismatch: compile_error
  rationale: |
    Catches the common bug where someone copies a .phisql file to a new
    name and forgets to update the POLICY declaration inside.

string_only_compilation:
  description: |
    When PhiSQL is compiled from a string with no associated filename
    (e.g., embedded in a tool's UI, included in another configuration
    format), the POLICY declaration is the only source of the name.
    If absent, the policy name is null and the caller must provide one.

description_clause:
  destination: policy_metadata_description
  description: |
    The DESCRIPTION '<text>' clause, when present on a POLICY declaration,
    compiles to metadata.description in the policy JSON, so the description
    travels with the policy through export, import, and sharing. The compiler
    also returns the text on CompileResult, which is what callers that keep a
    description elsewhere (such as a sibling <basename>.md file) read. Before
    schema 1.3.0 the schema had no description field and CompileResult was the
    only destination.

review_sampling:
  syntax: CONFIGURE REVIEW ( samplingRate = <number> )
  destination: config.review.samplingRate
  description: |
    The probability, from 0.0 to 1.0, that a filter request is selected for
    human spot review, independent of what was detected. A span-level review
    flag cannot catch a value that was never detected; a random sample of
    whole requests can. The default, 0.0, selects nothing.
  selection: |
    Per request and stateless: a request is selected when a value drawn
    uniformly from [0, 1) is below the rate. The draw happens once per
    request, even when the input is split into chunks. No count is kept per
    policy or shared between nodes, so the achieved rate converges on the
    configured one but is not exact for small volumes.
  output: |
    Selection never changes the redacted output. The runtime reports it on
    the filter result (reviewSampled), so filter and explain results both
    carry it. How a server surfaces it to callers is outside this spec.
  keyword: |
    REVIEW is matched as an identifier, not a reserved keyword, so it stays
    usable as a policy name or setting key. REVIEW, EMAIL, WORD, EXCEL, CSV,
    and TABULAR SHEET are the only names accepted in that position; any
    other is a compile error.
  on_out_of_range: compile_error

leftover_check:
  syntax: |
    CONFIGURE REVIEW (
      leftoverCheck = ( mode = 'off' | 'onRequest' | 'always',
                        using = 'broad' | 'samePolicy' )
    )
  destination: config.review.leftoverCheck
  description: |
    After a request is redacted, the runtime runs detection again over the
    redacted output and reports anything still detectable. Random review
    sampling selects requests with no signal about where a miss is; the
    leftover check selects a request because something detectable remains,
    including kinds of information the policy never looked for.
  settings:
    mode:
      default: "off"
      values:
        "off": The check never runs.
        onRequest: |
          The check runs only when the caller asks for it through the
          runtime's API for that call.
        always: |
          The check runs on every request. A caller cannot turn it off for
          a single call.
    using:
      default: broad
      values:
        broad: |
          Every filter the policy defines, including custom identifiers,
          dictionaries, and PhEye filters, configured as written, plus every
          other built-in identifier at its defaults. The firstName and surname
          dictionaries are the exception: they match common words at their
          defaults, so they run only as the policy defines them. It finds kinds
          of information the policy did not cover, and is always a superset of
          samePolicy.
        samePolicy: |
          Only the policy's own filters, configured as written. This confirms
          the policy took effect, for example in parts of a binary document
          that may not have been processed.
  exclusions: |
    The values the redaction itself inserted are not findings: stand-ins from
    strategies such as RANDOM_REPLACE look like PII on purpose. Values on the
    policy's top-level ignore lists (ignored, ignoredPatterns) are not
    findings either. Nothing else suppresses a finding: the policy's filters
    run in the check with their per-filter ignore lists (ignored,
    ignoredPatterns, ignoredFiles) stripped, and a strategy condition that
    leaves a value unredacted does not hide it from the check, so a reviewer
    sees it.
  split_input: |
    Findings are what a scan of the reassembled output would give. A runtime
    may scan in pieces, but must overlap them so a value spanning a chunk
    boundary is found.
  output: |
    The check never changes the redacted output. The runtime reports it on
    the filter result, alongside reviewSampled: whether the check was
    performed and, when it was not, why (notRequested when the policy's mode
    did not call for it, unreadableOutput, or checkFailed); the number of
    findings; and each finding's type, position in the output, and
    confidence. An output with no readable text, such as a PDF whose redacted
    pages are flattened to images, is reported as not performed
    (unreadableOutput), never as zero findings. A check that fails with an
    error is reported as not performed (checkFailed), and the redacted output
    is returned as it would be without the check: the redaction has already
    succeeded, so it does not fail because the check did. For an email,
    findings in redacted attachments are part of the message's own result,
    each naming its attachment.
  matched_text: |
    Findings in the filter result do not carry the matched text; it is in the
    output the caller already has, and leaving it out keeps it out of headers,
    logs, and audit records. A runtime library may return the text in-process
    when the calling application asks for it. A server never puts it in
    headers, logs, or audit records.
  outside_this_spec: |
    How a server surfaces the result (a response header, an explain field, an
    audit record, a metric), how a caller requests an onRequest check, and
    whether findings also select the request for human review.
  on_invalid: compile_error
  compile_errors:
    - leftoverCheck that is not a setting list.
    - An unknown key inside leftoverCheck.
    - A mode or using value outside its list.

email:
  syntax: |
    CONFIGURE EMAIL (
      headers = ( removeTechnical = <bool>, removeIdentity = <bool>,
                  removeDate = <bool>, removeSubject = <bool> ),
      attachments = 'keep' | 'remove' | 'redact',
      inlineImages = 'keep' | 'remove'
    )
  destination: config.email
  description: |
    How an email message (.eml, and Outlook .msg) is redacted beyond its text:
    which headers are removed outright, and what happens to attachments and
    inline images. Every setting is optional. Attachments and inline images
    default to remove, the strictest option of each, so a policy that says
    nothing about them does not return content nobody inspected; keep must
    be chosen explicitly. In a runtime without email support the block has
    no effect.
  settings:
    headers.removeTechnical:
      default: true
      effect: Removes the technical headers.
    headers.removeIdentity:
      default: true
      effect: Removes the identity headers.
    headers.removeDate:
      default: false
      effect: |
        Removes the Date header outright, whatever its format, without
        relying on a date identifier.
    headers.removeSubject:
      default: false
      effect: |
        Removes the Subject header instead of redacting it, for releases
        where even a redacted subject line should not ship.
    attachments:
      default: remove
      values:
        keep: |
          Returns attachments as they are, uninspected and unredacted, and
          reports them.
        remove: |
          Deletes attachments, including their filenames, and reports them.
        redact: |
          Redacts each attachment the runtime supports as a document (for
          example PDF, Word, Excel) with the same policy. An attachment the
          runtime cannot redact (an image, an archive, a legacy .doc) is
          removed and reported, so content nobody inspected does not leave.
    inlineImages:
      default: remove
      values:
        keep: |
          Returns images embedded in the body as they are, uninspected and
          unredacted, and reports them.
        remove: |
          Deletes images embedded in the body (referenced by cid:),
          neutralizes the references, and reports them. Independent of
          attachments.
  header_groups:
    technical:
      - Received
      - Return-Path
      - Message-ID
      - User-Agent
      - X-Mailer
      - X-MimeOLE
      - DKIM-Signature
      - Authentication-Results
      - Received-SPF
      - Autocrypt
      - every header beginning X-
      - every header beginning ARC-
    identity:
      - Bcc
      - Reply-To
      - Sender
      - every header beginning Resent-
  header_removal: |
    Header names match case-insensitively, as RFC 5322 requires, so
    x-mailer is a technical header like X-Mailer. Removing a header removes
    the field entirely, not only its value.
    Removed headers are not scanned. Kept headers outside the redacted set
    are kept exactly as they are.
  always_redacted: |
    Subject (unless removed), From, To, Cc, and every text body part, by the
    policy's identifiers. HTML bodies are redacted as markup, so values in
    attributes such as mailto: links are redacted too. Not configurable.
  nested_messages: |
    A message attached or forwarded inside another (a message/rfc822 part) is
    processed the same way, recursively: its own headers, body, and
    attachments follow the same settings.
  signed_and_encrypted: |
    A signed message (S/MIME or PGP) is redacted and its signature part is
    dropped, since redacting invalidates it; the drop is reported. An
    encrypted message is refused with an error and is never passed through
    unredacted.
  output: |
    A .msg input is written out as .eml. The runtime reports, with the filter
    result, every attachment or inline image kept without being inspected,
    every attachment or inline image removed (by remove, or under redact
    because it could not be redacted), and every dropped signature, so a
    caller can warn that content was not checked or was taken out. The leftover check covers redacted
    attachments as part of the message's own result, each finding naming its
    attachment. A redacted attachment the check could not cover, because its
    output has no readable text or its own check failed, is listed as
    unchecked.
  resource_limits: |
    Limits on email processing (largest message, attachment count, nesting
    depth) protect the server rather than decide redaction, so they are each
    server's own settings, not policy.
  keyword: |
    EMAIL is matched as an identifier, not a reserved keyword.
  on_invalid: compile_error
  compile_errors:
    - An unknown key in the block or in headers.
    - A header setting that is not TRUE or FALSE.
    - An attachments or inlineImages value outside its list.

word:
  syntax: |
    CONFIGURE WORD (
      headersFooters = 'redact' | 'keep',
      comments = 'remove' | 'redact',
      trackedChanges = 'accept' | 'redact',
      hiddenText = 'remove' | 'redact',
      charts = 'redact' | 'keep',
      uninspectableObjects = 'remove' | 'keep',
      removeDocumentProperties = <bool>,
      highlight = <bool>
    )
  destination: config.word
  applies_to: [.docx, .rtf]
  description: |
    How the parts of a Word (.docx) or Rich Text (.rtf) document outside its
    body text are handled. Every setting is optional, and the defaults are
    Philter Desktop's, which remove rather than redact wherever both are
    possible: a removed comment or an accepted deletion leaves nothing for a
    detector to miss. In a runtime without Word or RTF support the block has
    no effect.
  settings:
    headersFooters:
      default: redact
      values:
        redact: |
          Redacts the text of running headers and footers. Images and page
          numbers in them are left as they are.
        keep: Leaves headers and footers unscanned.
    comments:
      default: remove
      values:
        remove: Deletes every comment, with its author.
        redact: Keeps comments and redacts their text.
    trackedChanges:
      default: accept
      values:
        accept: |
          Accepts every insertion and deletion and removes the revision
          history, so deleted text is gone.
        redact: |
          Keeps the revisions and redacts their text, including deleted text.
    hiddenText:
      default: remove
      values:
        remove: Deletes text marked hidden.
        redact: Keeps hidden text and redacts it like visible text.
    charts:
      default: redact
      values:
        redact: Redacts chart titles, labels, and cached data values.
        keep: Leaves charts as they are.
    uninspectableObjects:
      default: remove
      values:
        remove: |
          Deletes embedded objects the runtime cannot read (legacy OLE
          objects, other programs' files).
        keep: Leaves them and reports them as uninspected.
    removeDocumentProperties:
      default: true
      effect: |
        Clears the document properties beyond the always-cleared authorship
        fields: title, subject, keywords, categories, the comments field, and
        custom properties. FALSE clears only the authorship fields; it never
        keeps authorship.
    highlight:
      default: false
      effect: Wraps each replacement in a highlight so a reviewer can find it.
  always_redacted: |
    Body text, footnotes, and endnotes, by the policy's identifiers. Embedded
    Word and Excel documents are redacted in place with the same policy,
    whatever uninspectableObjects says. Not configurable.
  authorship: |
    Author names and the authorship properties are always cleared, whatever
    the policy: dc:creator, cp:lastModifiedBy, Company, Manager, comment and
    revision authors, and word/people.xml. No setting turns this off, and
    removeDocumentProperties can only add to what is cleared
    (philterd/phileas#522).
  rtf: |
    For .rtf, each setting applies where the format has the corresponding
    part: headersFooters to \header and \footer groups, comments to
    \annotation groups, trackedChanges to \revised and \deleted text,
    hiddenText to \v text, uninspectableObjects to \object groups, and
    removeDocumentProperties to the \info group. charts and highlight have no
    RTF counterpart and are ignored for it.
  keyword: |
    WORD is matched as an identifier, not a reserved keyword.
  on_invalid: compile_error
  compile_errors:
    - An unknown key in the block.
    - A value outside a setting's list.
    - A removeDocumentProperties or highlight value that is not TRUE or FALSE.

excel:
  syntax: |
    CONFIGURE EXCEL (
      printHeadersFooters = 'redact' | 'keep',
      charts = 'redact' | 'keep',
      formulaCaches = 'redact' | 'keep',
      pivotCaches = 'redact' | 'keep',
      uninspectableObjects = 'remove' | 'keep',
      removeDocumentProperties = <bool>
    )
  destination: config.excel
  applies_to: [.xlsx]
  description: |
    How the parts of an Excel (.xlsx) workbook outside its cell text are
    handled. Every setting is optional, and the defaults are Philter
    Desktop's. In a runtime without Excel support the block has no effect.
    Worksheet and column rules are in the top-level tabular section (see
    tabular).
  settings:
    printHeadersFooters:
      default: redact
      values:
        redact: Redacts print headers and footers.
        keep: Leaves print headers and footers unscanned.
    charts:
      default: redact
      values:
        redact: Redacts chart titles, labels, and cached data values.
        keep: Leaves charts as they are.
    formulaCaches:
      default: redact
      values:
        redact: |
          A formula whose cached result holds a detected value becomes a
          static redacted value; the remaining cached results are cleared and
          the workbook is set to recalculate on open.
        keep: |
          Leaves cached results as they are, so a cached copy of a redacted
          value may remain.
    pivotCaches:
      default: redact
      values:
        redact: |
          Redacts the pivot cache's copy of the source data and sets it to
          refresh on open.
        keep: Leaves the pivot cache as it is.
    uninspectableObjects:
      default: remove
      values:
        remove: |
          Deletes embedded objects the runtime cannot read (legacy OLE
          objects, other programs' files).
        keep: Leaves them and reports them as uninspected.
    removeDocumentProperties:
      default: true
      effect: As for word.
  always_redacted: |
    Cell text and comments (legacy notes and threaded comments), by the
    policy's identifiers. Embedded Word and Excel documents are redacted in
    place with the same policy, whatever uninspectableObjects says. Not
    configurable.
  authorship: |
    Author names and the authorship properties are always cleared, whatever
    the policy: dc:creator, cp:lastModifiedBy, Company, Manager, comment
    authors, and persons. No setting turns this off (philterd/phileas#522).
  keyword: |
    EXCEL is matched as an identifier, not a reserved keyword.
  on_invalid: compile_error
  compile_errors:
    - An unknown key in the block.
    - A value outside a setting's list.
    - A removeDocumentProperties value that is not TRUE or FALSE.

csv:
  syntax: |
    CONFIGURE CSV (
      delimiter = '<one character>',
      quote = '<one character>',
      encoding = '<IANA encoding name>'
    )
  destination: config.csv
  applies_to: [.csv]
  description: |
    How a CSV document is read: its field delimiter, quote character, and
    encoding. Every setting is optional. No effect on .xlsx. Which columns
    are redacted is decided by the top-level tabular section, not here. In a
    runtime without CSV support the block has no effect.
  settings:
    delimiter:
      default: ","
      effect: The field delimiter. One character, not a line break.
    quote:
      default: '"'
      effect: |
        The quote character around fields that contain the delimiter, a
        quote, or a line break. One character, not a line break.
    encoding:
      default: UTF-8
      effect: The character encoding the document is read in, by its IANA name.
  string_escapes: |
    PhiSQL string literals support only the \' , \n, and \\ escapes, so a tab
    delimiter is written as a literal tab character between the quotes.
  keyword: |
    CSV is matched as an identifier, not a reserved keyword.
  on_invalid: compile_error
  compile_errors:
    - An unknown key in the block.
    - A delimiter or quote that is not exactly one character, or is a line break.
    - A delimiter and quote that are the same character.
    - An encoding that is not a non-empty string.

tabular:
  syntax: |
    CONFIGURE TABULAR SHEET (
      worksheet = '<name>',
      headerRows = <integer>,
      unlistedColumns = 'identifiers' | 'ignore' | 'redact',
      unlistedStrategies = [ ( strategy = '<STRATEGY>', ... ), ... ],
      columns = [
        ( header = '<text>' | index = <integer>,
          action = 'redact', strategies = [ ( strategy = '<STRATEGY>', ... ), ... ] ),
        ( header = '<text>' | index = <integer>, action = 'ignore' ),
        ( header = '<text>' | index = <integer>,
          action = 'filter', filters = [ '<identifiers key>', ... ] ),
        ...
      ]
    )
  destination: tabular.sheets
  applies_to: [.csv, .xlsx]
  description: |
    Column rules for tabular documents. In tabular data a column has a
    meaning, so a rule on a column can replace every value in it, including
    malformed or partial values a detector would miss, and can leave a column
    of non-sensitive identifiers alone. Each CONFIGURE TABULAR SHEET statement
    adds one sheet entry. Column rules decide what is redacted, so they are a
    top-level section beside graphical, not part of config. Row numbers and
    cell ranges change from one file to the next, so they stay per-request
    options and are not part of the policy.
  sheet_settings:
    worksheet:
      effect: |
        The worksheet the entry applies to, matched case-insensitively, as
        Excel compares sheet names. When absent, the entry applies to every
        worksheet without an entry of its own and to a CSV document.
    headerRows:
      default: 1
      effect: |
        The number of leading header rows. Header rows are never redacted. A
        column rule's header is matched against the last header row. 0 means
        the sheet has no header, and columns can only be picked by index.
    unlistedColumns:
      default: identifiers
      values:
        identifiers: Columns without a rule are scanned with every filter in identifiers.
        ignore: Columns without a rule are left unchanged.
        redact: |
          Columns without a rule are replaced whole with unlistedStrategies,
          with no detection: an allow-list, where only columns with a rule
          (for example ignore) survive unchanged.
    unlistedStrategies:
      default: "[ ( strategy = 'REDACT' ) ]"
      effect: |
        The strategies for columns without a rule. Allowed only when
        unlistedColumns is redact.
    columns:
      effect: |
        The column rules. At most one per header and per index. A header rule
        and an index rule can pick the same column, which cannot be checked
        when the policy is compiled, since the column a header names depends
        on the document. The column then follows the more protective rule:
        redact, then filter, then ignore. Two filter rules scan the column
        with the filters of both, and of two redact rules the one listed first
        applies.
  column_settings:
    header:
      effect: |
        Picks the column whose cell in the last header row shows this text,
        trimmed: a formula by its result, rich text as plain text, and a
        merged cell by its top-left value. When several columns share the
        header, the rule applies to every one of them, so an ambiguous header
        fails closed.
    index:
      effect: Picks the column at this position, counting from 1.
    action:
      values:
        redact: |
          Replaces every data cell whole with strategies, with no detection,
          whatever identifiers contains.
        ignore: Leaves the data cells unchanged.
        filter: |
          Scans each data cell with only the filters named in filters and
          replaces only what they find. Detection is probabilistic, as it is
          for identifiers, so this is the action for free-text columns.
    strategies:
      effect: |
        Required for redact, not allowed otherwise. The same shape as a
        filter's strategy list, so CRYPTO_REPLACE, FPE_ENCRYPT_REPLACE, and
        consistent pseudonymization (replacementScope) work unchanged. A
        condition is not allowed, since a whole-column rule replaces every
        cell, and date-only strategies are not allowed.
    filters:
      effect: |
        Required for filter, not allowed otherwise. Keys of identifiers, as
        they appear in the compiled policy (for example pheyes, emailAddress),
        not PhiSQL entity names. Each must be defined in identifiers. A key
        that holds several filters, such as pheyes (every DETECT PHEYE
        filter), uses all of them.
  sheet_selection: |
    At most one entry may name a given worksheet, and at most one entry may
    omit worksheet. An .xlsx worksheet follows the entry that names it, or
    else the entry without a worksheet, if there is one. A CSV is one unnamed
    sheet, so only the entry without a worksheet applies to it, and
    config.csv has no effect on .xlsx. One policy can therefore cover a
    pipeline that receives both formats.
  processing: |
    Each column is handled by its own rule, all in one pass over the cells.
    A redact rule never runs detection. With an empty identifiers and the
    default unlistedColumns, only columns with a rule are changed.
  runtime_contract: |
    The %t placeholder in redactionFormat expands to full-column for a
    whole-column replacement; the header name is not used, since a header can
    itself be sensitive. A header that matches no column is reported as a
    warning, not an error, since one policy may cover files whose columns
    differ. Per-request options that pick columns (an interactive column
    picker, for example) override the policy's rules for that request.
  unsupported_runtimes: |
    A runtime that does not implement tabular rules must reject a policy that
    sets tabular rather than ignore it, since ignoring it would leave columns
    unredacted without warning.
  keyword: |
    TABULAR and SHEET are matched as identifiers, not reserved keywords.
  on_invalid: compile_error
  compile_errors:
    - An unknown key in a sheet entry or a column rule.
    - Two entries naming the same worksheet (case-insensitively), or two entries without one.
    - A headerRows that is not a whole number of 0 or more.
    - An unlistedColumns value outside its list, or unlistedStrategies without unlistedColumns = 'redact'.
    - A column rule with both or neither of header and index, an index below 1, or a header when headerRows is 0.
    - Two column rules for the same header or the same index in one sheet.
    - A missing or unknown action.
    - A redact rule without strategies, or strategies on another action.
    - A filter rule without filters, a filters name not defined in identifiers, or filters on another action.
    - A strategy with a condition, a date-only strategy, or an unknown strategy.
